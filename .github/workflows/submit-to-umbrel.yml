name: Submit LaraPaper update to Umbrel App Store

# ---------------------------------------------------------------------------
# What this does
# ---------------------------------------------------------------------------
# Watches upstream LaraPaper (usetrmnl/larapaper) for a new STABLE release and,
# when one appears, opens (or updates) a version-bump pull request against
# getumbrel/umbrel-apps for the `usetrmnl-larapaper` package. The PR:
#   - sets the manifest `version` to the new upstream version
#   - pins docker-compose to `IMAGE:<version>@sha256:<multi-arch index digest>`
#   - refreshes `releaseNotes` with a link to the upstream release
#
# The PR is opened FROM a fork of umbrel-apps that the repo owner controls, TO
# getumbrel/umbrel-apps:master (fork -> upstream) — the standard OSS PR flow.
#
# ---------------------------------------------------------------------------
# One-time setup the repo owner (maintainer) must do — see README.md
# ---------------------------------------------------------------------------
#   1. Fork getumbrel/umbrel-apps under your account (e.g. bnussbau/umbrel-apps).
#   2. Create a Personal Access Token that can push to that fork AND open PRs on
#      getumbrel/umbrel-apps:
#        - classic PAT with the `public_repo` (or `repo`) scope. This is the one
#          that works: a fine-grained PAT can push to your fork but CANNOT open
#          the PR on getumbrel/umbrel-apps (it is not a repo you can grant it on),
#          so create-pull-request fails with "Resource not accessible by
#          personal access token".
#        - plus the `workflow` scope. A NEW PR branch starts from today's
#          umbrel-apps master; when umbrel-apps has edited its own
#          .github/workflows/ since your fork last caught up, GitHub refuses to
#          let a token without `workflow` push those commits to the fork. This
#          workflow never edits a workflow file itself.
#      Store it as an Actions secret named `UMBREL_APPS_TOKEN`.
#   3. Add an Actions *variable* `FORK_OWNER` = the fork owner's login
#      (e.g. `bnussbau`).
#
# Idempotency: if the fork owner already has an open PR on umbrel-apps touching
# this package, the bump is pushed to THAT PR's branch (whatever its name), so
# a new upstream release never opens a second, competing PR. Otherwise the
# branch is named `usetrmnl-larapaper-<version>`. Once the PR is merged, the
# "already published" check below sees the new version on umbrel-apps:master
# and the job goes quiet until the next upstream release.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Force a specific LaraPaper version (blank = latest stable)"
        required: false
        default: ""

permissions:
  contents: read

env:
  UPSTREAM_REPO: usetrmnl/larapaper
  IMAGE: ghcr.io/usetrmnl/larapaper
  APP_ID: usetrmnl-larapaper
  UMBREL_APPS: getumbrel/umbrel-apps
  UMBREL_BASE: master

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this packaging repo
        uses: actions/checkout@v5

      # --- 0. Is auto-submit configured on this repo? ------------------------
      # Opening a PR to getumbrel/umbrel-apps needs a fork + a PAT. Until the
      # repo owner sets those up (see README), skip the PR steps and finish
      # green with a notice, instead of failing the scheduled run every day.
      - name: Check auto-submit configuration
        id: cfg
        env:
          TOKEN: ${{ secrets.UMBREL_APPS_TOKEN }}
          FORK: ${{ vars.FORK_OWNER }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ] || [ -z "${FORK:-}" ]; then
            echo "::notice::Auto-submit is not configured yet. Add the Actions secret UMBREL_APPS_TOKEN and the Actions variable FORK_OWNER (see README) to enable opening PRs to getumbrel/umbrel-apps. The release check below still runs; the PR steps are skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # --- 1. Resolve the target LaraPaper version ---------------------------
      # Uses the latest NON-prerelease GitHub release, then hard-guards it to a
      # strict X.Y.Z so beta/nightly tags (e.g. 0.36.2-beta.1) can never ship.
      - name: Resolve target LaraPaper version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${FORCE}" ]; then
            TARGET="${FORCE}"
          else
            TARGET="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          fi
          if ! printf '%s' "${TARGET}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing non-stable version '${TARGET}'." ; exit 1
          fi
          echo "Target LaraPaper version: ${TARGET}"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      # --- 2. Resolve the multi-arch image digest ----------------------------
      # Pin the OCI image-INDEX digest (covers linux/amd64 + linux/arm64); Docker
      # resolves the correct per-arch layer at pull time. Also assert both arches
      # exist, because Umbrel requires amd64 + arm64.
      - name: Resolve multi-arch image digest
        id: digest
        run: |
          set -euo pipefail
          T="${{ steps.ver.outputs.target }}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${T}" --format '{{.Manifest.Digest}}')"
          echo "Index digest: ${DIGEST}"
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "::error::Unexpected digest '${DIGEST}'"; exit 1 ;;
          esac
          RAW="$(docker buildx imagetools inspect "${IMAGE}:${T}" --raw)"
          for arch in amd64 arm64; do
            printf '%s' "${RAW}" | grep -Eq "\"architecture\":[[:space:]]*\"${arch}\"" \
              || { echo "::error::Image ${IMAGE}:${T} is missing linux/${arch}"; exit 1; }
          done
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # --- 3. What version is already published on umbrel-apps:master? --------
      - name: Read version currently published on umbrel-apps
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if RAW="$(gh api "repos/${UMBREL_APPS}/contents/${APP_ID}/umbrel-app.yml?ref=${UMBREL_BASE}" --jq .content 2>/dev/null)"; then
            CUR="$(printf '%s' "$RAW" | base64 -d | grep -E '^version:' | head -1 | sed -E 's/version:[[:space:]]*"?([^"]+)"?.*/\1/')"
          else
            CUR="none" # app not published upstream yet (first submission)
          fi
          echo "Currently published: ${CUR}"
          echo "current=${CUR}" >> "$GITHUB_OUTPUT"

      # --- 4. Decide (target strictly newer than published?) -----------------
      - name: Decide whether an update is needed
        id: decide
        run: |
          set -euo pipefail
          T="${{ steps.ver.outputs.target }}"
          C="${{ steps.published.outputs.current }}"
          if [ "$C" = "none" ]; then
            echo "First submission — proceeding."
            echo "update=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          newest="$(printf '%s\n%s\n' "$T" "$C" | sort -V | tail -1)"
          if [ "$T" != "$C" ] && [ "$newest" = "$T" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "Up to date (published=$C, target=$T). Nothing to do."
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      # --- 4b. Make sure the umbrel-apps fork exists -------------------------
      # create-pull-request pushes the PR branch to FORK_OWNER/umbrel-apps, which
      # must already be a fork of getumbrel/umbrel-apps. If it is missing the run
      # would die with a cryptic "Not Found" from git. Create it from the token
      # owner's account (which is FORK_OWNER in the normal setup) and wait for
      # GitHub to finish provisioning it, so the owner only has to set the token
      # and FORK_OWNER, not fork by hand.
      - name: Ensure the umbrel-apps fork exists
        if: steps.decide.outputs.update == 'true' && steps.cfg.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.UMBREL_APPS_TOKEN }}
          FORK: ${{ vars.FORK_OWNER }}
        run: |
          set -uo pipefail
          if gh repo view "${FORK}/umbrel-apps" >/dev/null 2>&1; then
            echo "Fork ${FORK}/umbrel-apps already exists."
            exit 0
          fi
          # Best-effort auto-create. A classic PAT with the 'repo' scope can fork;
          # a fine-grained PAT usually cannot fork a repo it does not own (403), so
          # this may fail, which is fine -- we fall through to a clear message.
          echo "::notice::Fork ${FORK}/umbrel-apps not found; attempting to create it from ${UMBREL_APPS}."
          if gh api -X POST "repos/${UMBREL_APPS}/forks" -F default_branch_only=true >/dev/null 2>&1; then
            for i in $(seq 1 30); do
              if gh repo view "${FORK}/umbrel-apps" >/dev/null 2>&1; then
                echo "Fork ${FORK}/umbrel-apps is ready."
                exit 0
              fi
              echo "waiting for fork to be provisioned... ($i)"
              sleep 6
            done
          fi
          echo "::error::Could not find or auto-create ${FORK}/umbrel-apps. A fine-grained PAT usually cannot fork a repo you do not own. Do ONE of: (a) fork getumbrel/umbrel-apps by hand once (https://github.com/getumbrel/umbrel-apps -> Fork, owner ${FORK}), or (b) set UMBREL_APPS_TOKEN to a classic PAT with the 'repo' scope. Then re-run this workflow."
          exit 1

      # --- 5. Check out the upstream store into ./upstream -------------------
      - name: Checkout getumbrel/umbrel-apps
        if: steps.decide.outputs.update == 'true' && steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UMBREL_APPS }}
          ref: ${{ env.UMBREL_BASE }}
          path: upstream
          token: ${{ secrets.UMBREL_APPS_TOKEN }}
          persist-credentials: true

      # --- 6. Apply the maintained package + bump version/digest/notes -------
      # Runtime files (compose/exports/hook) are copied from THIS repo (we own
      # them). The manifest is bumped in place if it already exists upstream (so
      # Umbrel-curated fields — gallery, submission, icon — are preserved); on a
      # first submission we seed it from this repo's manifest.
      - name: Apply package changes
        if: steps.decide.outputs.update == 'true' && steps.cfg.outputs.configured == 'true'
        env:
          T: ${{ steps.ver.outputs.target }}
          D: ${{ steps.digest.outputs.digest }}
          C: ${{ steps.published.outputs.current }}
        run: |
          set -euo pipefail
          DEST="upstream/${APP_ID}"
          mkdir -p "${DEST}/hooks"
          cp "${APP_ID}/docker-compose.yml" "${DEST}/docker-compose.yml"
          cp "${APP_ID}/exports.sh"          "${DEST}/exports.sh"
          cp "${APP_ID}/hooks/pre-start"     "${DEST}/hooks/pre-start"

          # Bind-mount sources must exist as committed placeholder dirs in the
          # package, or the umbrel-apps linter rejects the PR with
          # "Bind mount source `${APP_DATA_DIR}/data/<x>/` is not committed".
          # Mirror whatever data/ placeholders this repo carries.
          if [ -d "${APP_ID}/data" ]; then
            mkdir -p "${DEST}/data"
            cp -R "${APP_ID}/data/." "${DEST}/data/"
          fi

          # exports.sh is SOURCED by Umbrel, not executed, and the linter warns
          # if it is executable. hooks/pre-start IS executed, so it keeps +x.
          chmod 644 "${DEST}/exports.sh"
          chmod +x  "${DEST}/hooks/pre-start"

          if [ ! -s "${DEST}/umbrel-app.yml" ]; then
            cp "${APP_ID}/umbrel-app.yml" "${DEST}/umbrel-app.yml"
          fi
          MAN="${DEST}/umbrel-app.yml"
          yq -i ".version = \"${T}\"" "${MAN}"
          # Umbrel convention: releaseNotes is empty for a NEW package's first
          # submission, and describes the change on subsequent updates.
          if [ "${C}" = "none" ]; then
            yq -i '.releaseNotes = ""' "${MAN}"
          else
            yq -i ".releaseNotes = \"Packages LaraPaper ${T}. Upstream release notes: https://github.com/${UPSTREAM_REPO}/releases/tag/${T}\"" "${MAN}"
          fi
          yq -i ".services.app.image = \"${IMAGE}:${T}@${D}\"" "${DEST}/docker-compose.yml"

          echo "----- resulting diff -----"
          git -C upstream --no-pager diff -- "${APP_ID}" || true

      # --- 7a. Is there already an open umbrel-apps PR for this package? -----
      # If the fork owner already has an open PR touching APP_ID (e.g. the
      # first-submission PR still under review when upstream ships the next
      # version), we push the bump to THAT PR's branch instead of opening a
      # second, competing PR. Reading public PRs needs no special token.
      - name: Find an open umbrel-apps PR for this package
        id: existing
        if: steps.decide.outputs.update == 'true' && steps.cfg.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORK: ${{ vars.FORK_OWNER }}
        run: |
          set -euo pipefail
          NUMBER=""; REF=""
          while read -r n ref; do
            [ -n "${n}" ] || continue
            if gh api "repos/${UMBREL_APPS}/pulls/${n}/files" --paginate --jq '.[].filename' \
                 | grep -q "^${APP_ID}/"; then
              NUMBER="${n}"; REF="${ref}"; break
            fi
          done < <(gh api "repos/${UMBREL_APPS}/pulls?state=open&per_page=100" --paginate \
                     --jq ".[] | select(.head.repo.owner.login == \"${FORK}\") | \"\(.number) \(.head.ref)\"")
          if [ -n "${NUMBER}" ]; then
            echo "Open PR #${NUMBER} (branch ${FORK}:${REF}) already covers ${APP_ID}; will update it."
          else
            echo "No open PR from ${FORK} touches ${APP_ID}; a new one will be opened."
          fi
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}"       >> "$GITHUB_OUTPUT"

      # --- 7b. Commit and push the PR branch to the fork ---------------------
      # Branch = the existing PR's head if there is one, else APP_ID-<version>.
      # The push uses the credentials actions/checkout persisted from
      # UMBREL_APPS_TOKEN (they apply to any github.com remote). Re-runs skip
      # the push when the fork branch already holds exactly this content, so a
      # PR under review is not rewritten every day for nothing.
      #
      # A branch that already exists on the fork (the open PR's head) gets the
      # bump as a new commit ON TOP of it, pushed as a plain fast-forward. It is
      # never rebuilt on today's umbrel-apps master and force-pushed: a rebuilt
      # branch carries every upstream commit since the PR's base, and GitHub
      # refuses the whole push when one of them edits .github/workflows/ and the
      # token lacks the `workflow` scope (2026-09-27: umbrel-apps changed
      # lint-apps.yml on 09-17). A commit on top only touches APP_ID/, so it
      # needs no such scope, and any commit a reviewer pushed to the PR stays.
      - name: Push the update branch to the fork
        id: push
        if: steps.decide.outputs.update == 'true' && steps.cfg.outputs.configured == 'true'
        env:
          FORK: ${{ vars.FORK_OWNER }}
          T: ${{ steps.ver.outputs.target }}
          EXISTING_REF: ${{ steps.existing.outputs.ref }}
        run: |
          set -euo pipefail
          cd upstream
          BRANCH="${EXISTING_REF:-${APP_ID}-${T}}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "${BRANCH}"
          git add -A -- "${APP_ID}"
          if git diff --cached --quiet; then
            echo "Package is identical to ${UMBREL_APPS}:${UMBREL_BASE}; nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git remote add fork "https://github.com/${FORK}/umbrel-apps.git"
          if git fetch -q --depth=1 fork "${BRANCH}" 2>/dev/null; then
            # Move HEAD + index onto the fork branch. The working tree keeps the
            # finished package; re-stage only APP_ID/ from it.
            git reset -q FETCH_HEAD
            git add -A -- "${APP_ID}"
            if git diff --cached --quiet; then
              echo "Fork branch ${FORK}:${BRANCH} already has this content; nothing to push."
              echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          elif [ -n "${EXISTING_REF}" ]; then
            echo "::error::Could not fetch ${FORK}:${BRANCH}, the head of the open PR on ${UMBREL_APPS}. Not pushing, so the PR is left as it is. Re-run later."
            exit 1
          fi
          git commit -q -m "${APP_ID}: update to ${T}"
          # No --force: an existing branch only ever fast-forwards.
          if ! OUT="$(git push -q fork "HEAD:refs/heads/${BRANCH}" 2>&1)"; then
            printf '%s\n' "${OUT}"
            if grep -q 'refusing to allow .*workflow' <<< "${OUT}"; then
              echo "::error::GitHub refused the push: this new branch starts from today's ${UMBREL_APPS}:${UMBREL_BASE}, which has edits to .github/workflows/ that ${FORK}/umbrel-apps does not have yet, and forwarding those needs the 'workflow' scope. Permanent fix: open the classic token behind UMBREL_APPS_TOKEN at https://github.com/settings/tokens, tick 'workflow', click 'Update token' (the token value stays the same, so the secret needs no change). One-off alternative: click 'Sync fork' on https://github.com/${FORK}/umbrel-apps. Then re-run this workflow."
            fi
            exit 1
          fi
          echo "Pushed ${APP_ID} ${T} to ${FORK}:${BRANCH}."
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # --- 7c. Open the cross-repo PR (fork -> upstream) if none exists ------
      # Opening a PR on getumbrel/umbrel-apps is the one call that needs a
      # classic PAT (see the header). If it fails, the branch is already on the
      # fork, so the error links the one-click "compare" page as a fallback.
      - name: Open PR to umbrel-apps
        if: steps.decide.outputs.update == 'true' && steps.cfg.outputs.configured == 'true' && steps.existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.UMBREL_APPS_TOKEN }}
          FORK: ${{ vars.FORK_OWNER }}
          BRANCH: ${{ steps.push.outputs.branch }}
          T: ${{ steps.ver.outputs.target }}
          C: ${{ steps.published.outputs.current }}
          D: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          TITLE="${APP_ID}: update to ${T}"
          cat > pr-body.md <<EOF
          Updates the \`${APP_ID}\` package: **${C} → ${T}**.

          - Image: \`${IMAGE}:${T}\`
          - Digest (multi-arch index, \`linux/amd64\` + \`linux/arm64\`): \`${D}\`
          - Upstream release notes: https://github.com/${UPSTREAM_REPO}/releases/tag/${T}

          **Automated version + digest bump** opened by the LaraPaper packaging
          repo's release watcher. It changes only the manifest \`version\`, the
          pinned image tag/digest, and \`releaseNotes\` — no compose, exports,
          hooks, \`app_proxy\`, permissions, or persistence changes.

          **Testing:** the package structure (fresh install, \`app_proxy\` device
          polling over the whitelisted device/webhook routes, rendered image
          fetch, SQLite persistence) was runtime-verified on a real Umbrel device
          (\`linux/amd64\`) at the baseline version. This individual version bump
          was **not** runtime-tested
          — a maintainer should confirm the update path on their instance before
          merge. No generated secrets or private data are included.

          Developer: [usetrmnl/larapaper](https://github.com/usetrmnl/larapaper) · packaging by arquiguru.
          EOF
          if URL="$(gh pr create --repo "${UMBREL_APPS}" --base "${UMBREL_BASE}" \
                      --head "${FORK}:${BRANCH}" --title "${TITLE}" --body-file pr-body.md)"; then
            echo "Opened ${URL}"
          else
            echo "::error::Could not open the PR on ${UMBREL_APPS}. The branch IS pushed to ${FORK}/umbrel-apps:${BRANCH} — open it by hand at https://github.com/${UMBREL_APPS}/compare/${UMBREL_BASE}...${FORK}:${BRANCH}?expand=1 — and, to make this automatic, replace the UMBREL_APPS_TOKEN secret with a CLASSIC PAT that has the 'public_repo' scope (a fine-grained PAT cannot open PRs on repos you do not own; see README)."
            exit 1
          fi

      - name: Report
        if: steps.decide.outputs.update == 'true' && steps.cfg.outputs.configured == 'true' && steps.existing.outputs.number != ''
        env:
          N: ${{ steps.existing.outputs.number }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          T: ${{ steps.ver.outputs.target }}
        run: |
          if [ "${PUSHED}" = "true" ]; then
            echo "::notice::Updated open PR https://github.com/${UMBREL_APPS}/pull/${N} to ${APP_ID} ${T}."
          else
            echo "::notice::Open PR https://github.com/${UMBREL_APPS}/pull/${N} already at ${APP_ID} ${T}; nothing pushed."
          fi
