name: Submit LaraPaper update to Umbrel App Store

# ---------------------------------------------------------------------------
# What this does
# ---------------------------------------------------------------------------
# Watches upstream LaraPaper (usetrmnl/larapaper) for a new STABLE release and,
# when one appears, opens (or updates) a version-bump pull request against
# getumbrel/umbrel-apps for the `larapaper` package. The PR:
#   - sets the manifest `version` to the new upstream version
#   - pins docker-compose to `IMAGE:<version>@sha256:<multi-arch index digest>`
#   - refreshes `releaseNotes` with a link to the upstream release
#
# The PR is opened FROM a fork of umbrel-apps that the repo owner controls, TO
# getumbrel/umbrel-apps:master (fork -> upstream) — the standard OSS PR flow.
#
# ---------------------------------------------------------------------------
# One-time setup the repo owner (maintainer) must do — see README.md
# ---------------------------------------------------------------------------
#   1. Fork getumbrel/umbrel-apps under your account (e.g. bnussbau/umbrel-apps).
#   2. Create a Personal Access Token that can push to that fork AND open PRs on
#      getumbrel/umbrel-apps:
#        - classic PAT: scope `repo`, OR
#        - fine-grained PAT: Contents = Read/Write + Pull requests = Read/Write,
#          granted on your umbrel-apps fork.
#      Store it as an Actions secret named `UMBREL_APPS_TOKEN`.
#   3. Add an Actions *variable* `FORK_OWNER` = the fork owner's login
#      (e.g. `bnussbau`).
#
# Idempotency: the PR branch is named `larapaper-<version>`, so a re-run for the
# same version updates the existing PR instead of opening a duplicate. Once the
# PR is merged, the "already published" check below sees the new version on
# umbrel-apps:master and the job goes quiet until the next upstream release.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Force a specific LaraPaper version (blank = latest stable)"
        required: false
        default: ""

permissions:
  contents: read

env:
  UPSTREAM_REPO: usetrmnl/larapaper
  IMAGE: ghcr.io/usetrmnl/larapaper
  APP_ID: larapaper
  UMBREL_APPS: getumbrel/umbrel-apps
  UMBREL_BASE: master

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this packaging repo
        uses: actions/checkout@v4

      # --- 1. Resolve the target LaraPaper version ---------------------------
      # Uses the latest NON-prerelease GitHub release, then hard-guards it to a
      # strict X.Y.Z so beta/nightly tags (e.g. 0.36.2-beta.1) can never ship.
      - name: Resolve target LaraPaper version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${FORCE}" ]; then
            TARGET="${FORCE}"
          else
            TARGET="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          fi
          if ! printf '%s' "${TARGET}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing non-stable version '${TARGET}'." ; exit 1
          fi
          echo "Target LaraPaper version: ${TARGET}"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      # --- 2. Resolve the multi-arch image digest ----------------------------
      # Pin the OCI image-INDEX digest (covers linux/amd64 + linux/arm64); Docker
      # resolves the correct per-arch layer at pull time. Also assert both arches
      # exist, because Umbrel requires amd64 + arm64.
      - name: Resolve multi-arch image digest
        id: digest
        run: |
          set -euo pipefail
          T="${{ steps.ver.outputs.target }}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${T}" --format '{{.Manifest.Digest}}')"
          echo "Index digest: ${DIGEST}"
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "::error::Unexpected digest '${DIGEST}'"; exit 1 ;;
          esac
          RAW="$(docker buildx imagetools inspect "${IMAGE}:${T}" --raw)"
          for arch in amd64 arm64; do
            printf '%s' "${RAW}" | grep -Eq "\"architecture\":[[:space:]]*\"${arch}\"" \
              || { echo "::error::Image ${IMAGE}:${T} is missing linux/${arch}"; exit 1; }
          done
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # --- 3. What version is already published on umbrel-apps:master? --------
      - name: Read version currently published on umbrel-apps
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if RAW="$(gh api "repos/${UMBREL_APPS}/contents/${APP_ID}/umbrel-app.yml?ref=${UMBREL_BASE}" --jq .content 2>/dev/null)"; then
            CUR="$(printf '%s' "$RAW" | base64 -d | grep -E '^version:' | head -1 | sed -E 's/version:[[:space:]]*"?([^"]+)"?.*/\1/')"
          else
            CUR="none" # app not published upstream yet (first submission)
          fi
          echo "Currently published: ${CUR}"
          echo "current=${CUR}" >> "$GITHUB_OUTPUT"

      # --- 4. Decide (target strictly newer than published?) -----------------
      - name: Decide whether an update is needed
        id: decide
        run: |
          set -euo pipefail
          T="${{ steps.ver.outputs.target }}"
          C="${{ steps.published.outputs.current }}"
          if [ "$C" = "none" ]; then
            echo "First submission — proceeding."
            echo "update=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          newest="$(printf '%s\n%s\n' "$T" "$C" | sort -V | tail -1)"
          if [ "$T" != "$C" ] && [ "$newest" = "$T" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "Up to date (published=$C, target=$T). Nothing to do."
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      # --- 5. Check out the upstream store into ./upstream -------------------
      - name: Checkout getumbrel/umbrel-apps
        if: steps.decide.outputs.update == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UMBREL_APPS }}
          ref: ${{ env.UMBREL_BASE }}
          path: upstream
          token: ${{ secrets.UMBREL_APPS_TOKEN }}
          persist-credentials: true

      # --- 6. Apply the maintained package + bump version/digest/notes -------
      # Runtime files (compose/exports/hook) are copied from THIS repo (we own
      # them). The manifest is bumped in place if it already exists upstream (so
      # Umbrel-curated fields — gallery, submission, icon — are preserved); on a
      # first submission we seed it from this repo's manifest.
      - name: Apply package changes
        if: steps.decide.outputs.update == 'true'
        env:
          T: ${{ steps.ver.outputs.target }}
          D: ${{ steps.digest.outputs.digest }}
          C: ${{ steps.published.outputs.current }}
        run: |
          set -euo pipefail
          DEST="upstream/${APP_ID}"
          mkdir -p "${DEST}/hooks"
          cp larapaper/docker-compose.yml "${DEST}/docker-compose.yml"
          cp larapaper/exports.sh          "${DEST}/exports.sh"
          cp larapaper/hooks/pre-start     "${DEST}/hooks/pre-start"
          chmod +x "${DEST}/exports.sh" "${DEST}/hooks/pre-start"

          if [ ! -s "${DEST}/umbrel-app.yml" ]; then
            cp larapaper/umbrel-app.yml "${DEST}/umbrel-app.yml"
          fi
          MAN="${DEST}/umbrel-app.yml"
          yq -i ".version = \"${T}\"" "${MAN}"
          # Umbrel convention: releaseNotes is empty for a NEW package's first
          # submission, and describes the change on subsequent updates.
          if [ "${C}" = "none" ]; then
            yq -i '.releaseNotes = ""' "${MAN}"
          else
            yq -i ".releaseNotes = \"Packages LaraPaper ${T}. Upstream release notes: https://github.com/${UPSTREAM_REPO}/releases/tag/${T}\"" "${MAN}"
          fi
          yq -i ".services.server.image = \"${IMAGE}:${T}@${D}\"" "${DEST}/docker-compose.yml"

          echo "----- resulting diff -----"
          git -C upstream --no-pager diff -- "${APP_ID}" || true

      # --- 7. Open / update the cross-repo PR (fork -> upstream) -------------
      - name: Open or update PR to umbrel-apps
        if: steps.decide.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.UMBREL_APPS_TOKEN }}
          path: upstream
          push-to-fork: ${{ vars.FORK_OWNER }}/umbrel-apps
          branch: larapaper-${{ steps.ver.outputs.target }}
          base: ${{ env.UMBREL_BASE }}
          delete-branch: true
          commit-message: "larapaper: update to ${{ steps.ver.outputs.target }}"
          title: "larapaper: update to ${{ steps.ver.outputs.target }}"
          body: |
            Updates the `larapaper` package to LaraPaper **${{ steps.ver.outputs.target }}**.

            - Image: `${{ env.IMAGE }}:${{ steps.ver.outputs.target }}`
            - Digest (multi-arch index, `linux/amd64` + `linux/arm64`): `${{ steps.digest.outputs.digest }}`
            - Upstream release: https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${{ steps.ver.outputs.target }}

            Testing: packaging is version/digest-only over a package previously
            verified on Umbrel (fresh install + update path + device polling over
            `/api/*` and `/storage/*` + SQLite persistence). Opened automatically
            by the LaraPaper packaging repo's release watcher.

            Developer: [usetrmnl/larapaper](https://github.com/usetrmnl/larapaper) · packaging by arquiguru.
